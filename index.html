<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BPM y tono de canciones</title>
<style>
:root{--bg:#f7f6f2;--card:#fff;--text:#1d1d1b;--muted:#6b6a64;--line:#e3e1d9;--accent:#5b3df5;--accent-t:#fff;--chip:#efecff}
@media (prefers-color-scheme:dark){:root{--bg:#141418;--card:#1e1e24;--text:#f1f0ec;--muted:#9c9a94;--line:#30303a;--accent:#8b78ff;--accent-t:#14141a;--chip:#2a2644}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4}
main{max-width:680px;margin:0 auto;padding:28px 16px 48px}
h1{font-size:1.6rem;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 20px}
form{display:flex;gap:8px}
input{flex:1;min-width:0;font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text)}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
button{font:inherit;font-weight:600;padding:12px 18px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-t);cursor:pointer}
button:disabled{opacity:.5;cursor:default}
#out{margin-top:20px;display:grid;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.t{font-weight:700;font-size:1.05rem}
.a{color:var(--muted);margin-bottom:12px}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:var(--chip);border-radius:10px;padding:8px 14px;min-width:96px}
.stat small{display:block;color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.04em}
.stat b{font-size:1.35rem}
.msg{color:var(--muted);text-align:center;padding:20px}
footer{margin-top:28px;color:var(--muted);font-size:.8rem}
a{color:var(--accent)}
</style>
</head>
<body>
<main>
  <h1>🎵 BPM y tono</h1>
  <p class="sub">Busca una canción (mejor con el artista) y obtén su BPM, tono y clave Camelot.</p>
  <form id="f">
    <input id="q" type="search" placeholder="Ej.: Blinding Lights The Weeknd" autocomplete="off" required>
    <button id="b" type="submit">Buscar</button>
  </form>
  <div id="out"></div>
  <footer>Datos de <a href="https://getsongbpm.com" target="_blank" rel="noopener">GetSongBPM.com</a>.</footer>
</main>
<script>
const out = document.getElementById('out'), btn = document.getElementById('b');
const NOTES_ES = ['Do','Do♯','Re','Re♯','Mi','Fa','Fa♯','Sol','Sol♯','La','La♯','Si'];
const PC = {C:0,D:2,E:4,F:5,G:7,A:9,B:11};
const MAJ_B = [8,3,10,5,12,7,2,9,4,11,6,1];
const MIN_A = [5,12,7,2,9,4,11,6,1,8,3,10];

function esc(s){const d=document.createElement('div');d.textContent=String(s==null?'':s);return d.innerHTML}

// "Em", "F#", "Bb", "C♯m" -> { es: "Mi menor", camelot: "9A" }
function parseKey(k){
  if(!k) return null;
  const m = String(k).trim().match(/^([A-Ga-g])\s*([#♯b♭]?)\s*(m|min|minor|maj|major|M)?$/);
  if(!m) return { es: k, camelot: null };
  let pc = PC[m[1].toUpperCase()];
  if(m[2]==='#'||m[2]==='♯') pc = (pc+1)%12;
  if(m[2]==='b'||m[2]==='♭') pc = (pc+11)%12;
  const minor = /^m(in|inor)?$/.test(m[3]||'');
  return { es: NOTES_ES[pc] + (minor ? ' menor' : ' mayor'), camelot: (minor ? MIN_A[pc] + 'A' : MAJ_B[pc] + 'B') };
}

async function getJSON(url){
  const r = await fetch(url);
  const d = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(d.error || 'Error ' + r.status);
  return d;
}

function card(s){
  const key = parseKey(s.key_of);
  const artist = s.artist && s.artist.name ? s.artist.name : '';
  return `<div class="card">
    <div class="t">${esc(s.title)}</div><div class="a">${esc(artist)}</div>
    <div class="stats">
      <div class="stat"><small>BPM</small><b>${esc(s.tempo || '–')}</b></div>
      <div class="stat"><small>Tono</small><b>${esc(key ? key.es : '–')}</b></div>
      <div class="stat"><small>Camelot</small><b>${esc((key && key.camelot) || s.camelot || '–')}</b></div>
    </div></div>`;
}

document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const q = document.getElementById('q').value.trim();
  if(!q) return;
  btn.disabled = true;
  out.innerHTML = '<div class="msg">Buscando…</div>';
  try {
    const res = await getJSON('/api/search?q=' + encodeURIComponent(q));
    let list = Array.isArray(res.search) ? res.search : [];
    if(!list.length){ out.innerHTML = '<div class="msg">Sin resultados. Prueba con otro título o añade el artista.</div>'; return; }
    // Si la búsqueda no trae tempo o tono, se completa con la ficha de cada canción.
    list = await Promise.all(list.slice(0,6).map(async s => {
      if(s.tempo && s.key_of) return s;
      try { const d = await getJSON('/api/song?id=' + encodeURIComponent(s.id)); return Object.assign({}, s, d.song || {}); }
      catch { return s; }
    }));
    out.innerHTML = list.map(card).join('');
  } catch(err) {
    out.innerHTML = '<div class="msg">' + esc(err.message) + '</div>';
  } finally { btn.disabled = false; }
});
</script>
</body>
</html>
